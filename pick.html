<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutline</title>
<style>
  :root { --bg:#1a1b26; --bg2:#16161e; --bg3:#24283b; --fg:#c0caf5; --muted:#565f89; --accent:#7aa2f7; --red:#f7768e; --font:monospace; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font), monospace; font-size:14px; }
  main { max-width:920px; margin:0 auto; padding:36px 24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:14px; margin:28px 0 8px; color:var(--accent); font-weight:700; }
  p { color:var(--muted); margin:0; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--bg3); }
  li { display:flex; gap:16px; align-items:center; padding:11px 10px; border-bottom:1px solid var(--bg3); cursor:pointer; }
  li:hover, li.active { background:var(--bg3); }
  li.active { outline:1px solid var(--accent); }
  .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); white-space:nowrap; }
  .del { color:var(--muted); border:1px solid transparent; padding:0 6px; }
  .del:hover { color:var(--red); border-color:var(--red); }
  .empty { color:var(--muted); padding:14px 10px; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Cutline</h1>
  <p>Open a project, or click a video to start a new one · <b>↑/↓</b> + <b>Enter</b></p>
  <h2>Projects</h2>
  <ul id="projects"></ul>
  <h2 id="videosHead">Videos</h2>
  <ul id="videos"></ul>
</main>
<script>
let items = [], active = 0;
const mb = n => n > 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.max(1, Math.round(n / 1e6)) + " MB";
function render(d) {
  items = [];
  const pu = document.getElementById("projects"), vu = document.getElementById("videos");
  pu.innerHTML = ""; vu.innerHTML = "";
  if (!d.projects.length) pu.innerHTML = `<li class="empty">No projects yet — pick a video below.</li>`;
  for (const p of d.projects) {
    const li = row(p.name, `${p.videos} video${p.videos === 1 ? "" : "s"} · ${p.clips} clips · ${p.modified}`, () => post("/api/openproject", { file: p.file }));
    const ren = document.createElement("span"); ren.className = "del"; ren.textContent = "rename"; ren.title = "Rename this project";
    ren.onclick = async e => { e.stopPropagation(); const name = prompt("New project name:", p.name);
      if (name && name.trim() && name.trim() !== p.name) { await post("/api/renameproject", { file: p.file, name: name.trim() }, false); load(); } };
    li.appendChild(ren);
    const del = document.createElement("span"); del.className = "del"; del.textContent = "delete"; del.title = "Delete this project (videos are kept)";
    del.onclick = async e => { e.stopPropagation(); if (confirm(`Delete project "${p.name}"? Your videos are not touched.`)) { await post("/api/deleteproject", { file: p.file }, false); load(); } };
    li.appendChild(del); pu.appendChild(li);
  }
  const vdir = d.videosDir || "~/Videos";
  document.getElementById("videosHead").textContent = `Videos in ${vdir}`;
  if (!d.videos.length) { vu.innerHTML = `<li class="empty"></li>`; vu.firstChild.textContent = `No videos in ${vdir} yet. You can also run: cutline /path/to/video`; }
  for (const v of d.videos) vu.appendChild(row(v.name, `${v.modified} · ${mb(v.size)}`, () => post("/api/new", { path: v.path })));
  highlight();
}
function row(name, meta, go) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="name"></span><span class="meta"></span>`;
  li.children[0].textContent = name; li.children[1].textContent = meta;
  li.onclick = go; items.push({ li, go }); return li;
}
function highlight() { items.forEach((it, i) => it.li.classList.toggle("active", i === active)); items[active]?.li.scrollIntoView({ block: "nearest" }); }
async function post(url, body, reload = true) {
  const r = await (await fetch(url, { method: "POST", body: JSON.stringify(body) })).json();
  if (r.error) return alert(r.error);
  if (reload) location.reload();
}
window.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") active = Math.min(items.length - 1, active + 1);
  else if (e.key === "ArrowUp") active = Math.max(0, active - 1);
  else if (e.key === "Enter" && items[active]) return items[active].go();
  else return;
  e.preventDefault(); highlight();
});
function applyTheme(th) {
  const c = th.colors, root = document.documentElement.style;
  root.setProperty("--bg", c.background); root.setProperty("--bg2", c.dark_background || c.background);
  root.setProperty("--bg3", c.lighter_background || c.selection); root.setProperty("--fg", c.foreground);
  root.setProperty("--muted", c.muted); root.setProperty("--accent", c.accent); root.setProperty("--red", c.red);
  root.setProperty("--font", `"${th.font}"`);
}
setInterval(async () => { try { applyTheme(await (await fetch("/api/theme")).json()); } catch {} }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { fetch("/api/beat"); load(); } });
window.addEventListener("pagehide", () => navigator.sendBeacon("/api/bye"));
async function load() {
  const d = await (await fetch("/api/home")).json();
  applyTheme(d.theme); render(d);
}
load();
setInterval(() => fetch("/api/beat"), 5000); fetch("/api/beat");
</script>
</body>
</html>
